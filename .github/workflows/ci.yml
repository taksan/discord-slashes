name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build and test
        run: ./mvnw -B clean verify

      - name: Publish to GitHub Packages
        if: >
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        run: |
          if [ -z "$MAVEN_PASSWORD" ]; then
            echo "::error::PACKAGES_PUBLISH_TOKEN repository secret is not configured."
            exit 1
          fi
          ./mvnw -B deploy -DskipTests -s .github/maven/settings.xml
        env:
          MAVEN_USERNAME: ${{ github.repository_owner }}
          MAVEN_PASSWORD: ${{ secrets.PACKAGES_PUBLISH_TOKEN }}
